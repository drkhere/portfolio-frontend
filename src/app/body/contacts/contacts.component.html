        <form [formGroup]="contactForm" (ngSubmit)="sendMail()">
            <div class="form-group">
                <input type="text" formControlName="name" placeholder="Enter Your Name" />
                <div style="color: red; padding-left: 20px;" *ngIf="contactForm.get('name')?.invalid && contactForm.get('name')?.touched">
                    *Name is required
                </div>
            </div>

            <div class="form-group">
                <input type="email" formControlName="email" placeholder="Enter Your Email" />
                <div style="color: red; padding-left: 20px; " *ngIf="contactForm.get('email')?.invalid && contactForm.get('email')?.touched">
                    *Enter a valid email
                </div>
            </div>

            <div class="form-group">
                <input type="text" formControlName="subject" placeholder="Enter Your Subject" />
                <div style="color: red; padding-left: 20px; " *ngIf="contactForm.get('subject')?.invalid && contactForm.get('subject')?.touched">
                    *Subject is required
                </div>
            </div>

            <div class="form-group">
                <textarea formControlName="message" rows="5" placeholder="Enter Your Message"></textarea>
                <div style="color: red; padding-left: 20px; " *ngIf="contactForm.get('message')?.invalid && contactForm.get('message')?.touched">
                    *Message is required
                </div>
            </div>

            <button type="submit">Send</button>
        </form>

    </div>
</div>
